<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffcd38">
<meta name="description" content="모닝콜로 불려 나가 오늘의 퀘스트를 깨는 RPG 습관 앱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<script src="capacitor.js"></script>
</head><body>
<title>퀘스트콜</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 한 손 세로 앱. 위는 캐릭터 상태 카드, 가운데 내용, 아래 탭바. 전투·모닝콜은 전체 화면으로 덮음
   톤: 밝은 "스티커 퀘스트 보드" — 진한 잉크 외곽선 + 밀린 그림자, 능력치 4색을 그대로 화면 색으로 씀 */
:root {
  --bg: #f0eeff; --card: #ffffff; --card2: #f5f3ff; --fg: #1d1838; --dim: #5f5a7d; --edge: #1d1838; --soft: #dedaf3;
  --accent: #ffcd38; --on-accent: #1d1838; --ok: #10a865; --danger: #e8423f; --gold: #e3a000;
  --str: #ff6a3d; --int: #2f7dff; --vit: #10b07e; --dex: #9a5cff;
  --r0: #8d8aa6; --r1: #2f7dff; --r2: #9a5cff; --r3: #e3a000;
  --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --sh: 3px 3px 0 var(--edge); --sh-sm: 2px 2px 0 var(--edge);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14112b; --card: #211c42; --card2: #2b2554; --fg: #f4f2ff; --dim: #aca6d6; --edge: #050310; --soft: #3a3369;
  --accent: #ffd447; --on-accent: #1d1838; --ok: #2fd08a; --danger: #ff6767; --gold: #ffc53d;
  --str: #ff8659; --int: #5b9bff; --vit: #2fd39b; --dex: #b17dff; --r0: #a7a3c6; --r1: #5b9bff; --r2: #b17dff; --r3: #ffc53d; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #14112b; --card: #211c42; --card2: #2b2554; --fg: #f4f2ff; --dim: #aca6d6; --edge: #050310; --soft: #3a3369;
  --accent: #ffd447; --on-accent: #1d1838; --ok: #2fd08a; --danger: #ff6767; --gold: #ffc53d;
  --str: #ff8659; --int: #5b9bff; --vit: #2fd39b; --dex: #b17dff; --r0: #a7a3c6; --r1: #5b9bff; --r2: #b17dff; --r3: #ffc53d; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; -webkit-tap-highlight-color: transparent;
  background-image: radial-gradient(color-mix(in srgb, var(--fg) 7%, transparent) 1px, transparent 1.2px); background-size: 18px 18px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--int); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.grow { flex: 1; min-width: 0; }
.app { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h2 { font-size: 20px; } h3 { font-size: 17px; line-height: 1.3; }
.eyebrow { font-size: 11.5px; font-weight: 700; color: var(--dim); letter-spacing: .06em; }
.sub { font-size: 12.5px; color: var(--dim); }
.center { text-align: center; }

/* 상단: 캐릭터 상태 카드 */
.status { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; padding-block: 10px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.player { display: flex; align-items: center; gap: 12px; background: var(--card); border: 2px solid var(--edge); border-radius: 18px; box-shadow: var(--sh); padding: 8px 12px 8px 8px; }
.pava { width: 52px; height: 52px; border-radius: 14px; background: var(--card2); border: 2px solid var(--edge); flex: none; overflow: hidden; }
.pava svg { width: 100%; height: 100%; display: block; }
.prow { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.lv { font-family: var(--font-display); font-size: 22px; line-height: 1; }
.ptitle { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 8px; background: var(--card2); border: 1.5px solid var(--edge); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--c, var(--accent)); border-radius: 99px; transition: width .35s; }
.bar.xp { margin-top: 5px; } .bar.xp > i { background: var(--accent); }
.exptxt { font-size: 11px; color: var(--dim); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; background: var(--card); border: 2px solid var(--edge); border-radius: 99px; padding: 2px 10px 2px 6px; box-shadow: var(--sh-sm); }
.chip svg { width: 16px; height: 16px; }
.chip b { font-size: 13px; }
.c-gold svg { color: var(--gold); } .c-tk svg { color: var(--int); } .c-fire svg { color: var(--str); } .c-cp svg { color: var(--dex); }

/* 하단 탭바 */
.tabbar { position: fixed; z-index: 6; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); background: var(--card); border-top: 2px solid var(--edge); }
.tabbar .tb { display: grid; grid-template-columns: repeat(5, 1fr); width: 100%; max-width: 480px; padding-block: 6px; gap: 4px; }
.tabbar button { background: none; border: 0; border-radius: 14px; padding: 5px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11px; font-weight: 700; color: var(--dim); }
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-selected="true"] { color: var(--on-accent); background: var(--accent); border: 2px solid var(--edge); box-shadow: var(--sh-sm); padding: 3px 0 2px; }

main { flex: 1; padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sec { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.note { font-size: 12.5px; color: var(--fg); background: color-mix(in srgb, var(--int) 10%, var(--card)); border: 2px dashed color-mix(in srgb, var(--int) 55%, var(--edge)); border-radius: 14px; padding: 9px 12px; }
.list { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 8px; }
.empty { color: var(--dim); font-size: 13px; text-align: center; padding: 16px; border: 2px dashed var(--soft); border-radius: 14px; }

/* 버튼 */
.btn { border: 2px solid var(--edge); border-radius: 12px; padding: 9px 14px; font-weight: 800; background: var(--card); box-shadow: var(--sh-sm); transition: transform .06s, box-shadow .06s; }
.btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--edge); }
.btn.pri { background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; box-shadow: none; border-color: var(--soft); color: var(--dim); }
.btn.sm { padding: 6px 11px; font-size: 12.5px; border-radius: 10px; }
.btn.xs { padding: 3px 8px; font-size: 11.5px; border-radius: 8px; }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.card { background: var(--card); border: 2px solid var(--edge); border-radius: 16px; box-shadow: var(--sh); padding: 12px 14px; }

/* 오늘 탭 */
.hero-today { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 20px; border: 2px solid var(--edge); box-shadow: var(--sh);
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 85%, var(--card)), color-mix(in srgb, var(--str) 40%, var(--accent))); color: var(--on-accent); }
.hero-today .ht-l { flex: 1; min-width: 0; }
.hero-today h1 { font-size: 26px; line-height: 1.15; }
.hero-today .eyebrow, .hero-today .sub { color: color-mix(in srgb, var(--on-accent) 75%, transparent); }
.donut { width: 72px; height: 72px; border-radius: 50%; flex: none; display: flex; align-items: baseline; justify-content: center; padding-top: 18px; border: 2px solid var(--edge);
  background: radial-gradient(circle, #fff 56%, transparent 57%), conic-gradient(var(--ok) calc(var(--p) * 360deg), color-mix(in srgb, #fff 55%, transparent) 0); color: #1d1838; }
.donut b { font-family: var(--font-display); font-size: 24px; font-weight: 400; } .donut span { font-size: 12px; font-weight: 700; }
.callcard { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 2px solid var(--edge); border-radius: 16px; box-shadow: var(--sh); padding: 10px 12px; }
.callcard b { display: block; font-size: 15px; line-height: 1.3; } .callcard .sub { display: block; }
.cc-ic { width: 40px; height: 40px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; border: 2px solid var(--edge); flex: none; animation: wiggle 1.8s ease-in-out infinite; }
.cc-ic svg { width: 20px; height: 20px; }
.cc-go { font-weight: 800; font-size: 12.5px; color: var(--ok); white-space: nowrap; }
@keyframes wiggle { 0%, 70%, 100% { transform: rotate(0); } 75% { transform: rotate(-14deg); } 85% { transform: rotate(12deg); } 95% { transform: rotate(-6deg); } }
.snooze { display: flex; align-items: center; gap: 8px; background: color-mix(in srgb, var(--accent) 22%, var(--card)); border: 2px solid var(--edge); border-radius: 14px; padding: 9px 12px; }
.qcard { background: var(--card); border: 2px solid var(--edge); border-radius: 18px; box-shadow: var(--sh); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.qmain { display: flex; align-items: center; gap: 12px; }
.qtime { width: 54px; height: 54px; flex: none; border-radius: 16px; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #fff; background: var(--c); border: 2px solid var(--edge); }
.qt { font-weight: 800; font-size: 15px; line-height: 1.35; }
.amt { color: var(--c); white-space: nowrap; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.tag { display: inline-flex; align-items: center; gap: 2px; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--card2); color: var(--dim); border: 1.5px solid var(--soft); }
.tag svg { width: 12px; height: 12px; }
.tag.tstat { color: var(--c); border-color: color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 10%, var(--card)); }
.tag.tier { color: var(--fg); border-color: var(--edge); } .tag.t2 { background: color-mix(in srgb, var(--accent) 45%, var(--card)); } .tag.t3 { background: color-mix(in srgb, var(--dex) 35%, var(--card)); }
.tag.fire { color: var(--str); border-color: color-mix(in srgb, var(--str) 45%, transparent); }
.qbtns { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: none; }
.go { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--edge); background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: var(--sh-sm); }
.go:active { transform: translate(2px, 2px); box-shadow: none; }
.go svg { width: 20px; height: 20px; margin-left: 2px; }
.qstate { flex: none; font-weight: 800; font-size: 12px; }
.qstate.done { width: 40px; height: 40px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; border: 2px solid var(--edge); }
.qstate.done svg { width: 20px; height: 20px; }
.qstate.missed { color: var(--danger); }
.qcard.done { background: color-mix(in srgb, var(--ok) 9%, var(--card)); }
.qcard.done .qt { color: var(--dim); }
.qcard.missed { opacity: .62; }
.banner { background: color-mix(in srgb, var(--accent) 26%, var(--card)); border: 2px solid var(--edge); border-radius: 14px; padding: 9px 11px; font-size: 13px; display: flex; flex-direction: column; gap: 5px; }
.banner.soft { background: var(--card2); border-style: dashed; border-color: var(--soft); }
.delta { font-size: 12px; } .delta b { color: var(--ok); }
.hint-line { font-size: 11.5px; color: var(--dim); padding-left: 66px; }
.subq { display: flex; align-items: center; gap: 8px; background: var(--card); border: 2px solid var(--edge); border-radius: 12px; padding: 7px 8px 7px 12px; }
.subq.done { box-shadow: none; border-color: var(--soft); color: var(--dim); text-decoration: line-through; }
.chk { width: 26px; height: 26px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; } .chk svg { width: 15px; height: 15px; }

/* 목표 탭 */
.goal { background: var(--card); border: 2px solid var(--edge); border-radius: 18px; box-shadow: var(--sh); padding: 14px; display: flex; flex-direction: column; gap: 9px; position: relative; overflow: hidden; }
.goal::before { content: ""; position: absolute; inset: 0 0 auto auto; width: 90px; height: 90px; border-radius: 0 0 0 90px; background: color-mix(in srgb, var(--c) 18%, transparent); pointer-events: none; }
.g-h { display: flex; align-items: flex-start; gap: 8px; }
.g-pct { font-family: var(--font-display); font-size: 24px; color: var(--c); line-height: 1; }
.lvl { display: grid; grid-template-columns: 50px 1fr auto; align-items: center; gap: 8px; }
.lv-k { font-size: 12px; font-weight: 800; } .lv-v { font-size: 11.5px; color: var(--dim); white-space: nowrap; }
.goalbar { position: relative; overflow: visible; }
.goalbar > i { border-radius: 99px; }
.goalbar s { position: absolute; top: -4px; width: 3px; height: 14px; background: var(--edge); border-radius: 2px; transform: translateX(-1px); }
.g-routines { display: flex; flex-wrap: wrap; gap: 4px; }
.rrow { display: flex; align-items: center; gap: 10px; background: var(--card); border: 2px solid var(--edge); border-radius: 14px; padding: 9px 10px 9px 12px; }
.rrow.paused { opacity: .6; border-style: dashed; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--c, var(--dim)); border: 2px solid var(--edge); }

/* 지도 */
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; aspect-ratio: 1 / 1.08; max-width: 100%;
  background: var(--card); border: 2px solid var(--edge); border-radius: 14px; box-shadow: var(--sh-sm); padding: 6px 4px; text-align: center; }
.tile svg { width: 26px; height: 26px; }
.tile .tn { font-size: 10px; font-weight: 800; color: var(--dim); position: absolute; top: 3px; left: 7px; }
.tile .tl { font-size: 11.5px; font-weight: 800; line-height: 1.2; }
.tile .tc { font-size: 10.5px; color: var(--dim); }
.tile.t-gold { background: color-mix(in srgb, var(--gold) 16%, var(--card)); } .tile.t-gold svg { color: var(--gold); }
.tile.t-chest { background: color-mix(in srgb, var(--r2) 13%, var(--card)); } .tile.t-chest svg { color: var(--r2); }
.tile.t-gate { background: color-mix(in srgb, var(--int) 13%, var(--card)); } .tile.t-gate svg { color: var(--int); }
.tile.t-boss { background: color-mix(in srgb, var(--danger) 15%, var(--card)); } .tile.t-boss svg { color: var(--danger); }
.tile.cleared::after { content: "✓"; position: absolute; top: 2px; right: 6px; font-size: 12px; font-weight: 900; color: var(--ok); }
.tile.current { background: var(--accent); color: var(--on-accent); box-shadow: var(--sh); animation: bob 1.6s ease-in-out infinite; }
.tile.current .tc, .tile.current .tn { color: color-mix(in srgb, var(--on-accent) 70%, transparent); }
.tile.locked { opacity: .42; box-shadow: none; }
.tile .need { font-size: 10px; color: var(--danger); font-weight: 800; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.tile .tart { width: 38px; height: 38px; margin-block: -4px -2px; }
.foes { display: flex; gap: 6px; flex-wrap: wrap; }
.foe { display: flex; flex-direction: column; align-items: center; width: 72px; padding: 4px 2px; background: var(--card); border: 2px solid var(--edge); border-radius: 12px; }
.foe svg { width: 48px; height: 48px; } .foe small { font-size: 10px; font-weight: 700; color: var(--dim); text-align: center; line-height: 1.2; }
.foe.boss { width: 96px; background: color-mix(in srgb, var(--danger) 14%, var(--card)); } .foe.boss svg { width: 64px; height: 64px; }
.classes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.cls-card { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 2px 8px; background: var(--card); border: 2px solid var(--soft); border-radius: 14px; text-align: center; min-width: 0; }
.cls-card svg { width: 100%; max-width: 72px; aspect-ratio: 1; }
.cls-card b { font-size: 12px; } .cls-card span { font-size: 10.5px; color: var(--c); font-weight: 700; }
.cls-card.on { border-color: var(--edge); background: color-mix(in srgb, var(--c) 18%, var(--card)); box-shadow: var(--sh-sm); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--dim); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend svg { width: 14px; height: 14px; }

/* 캐릭터·가방 */
.stat { display: grid; grid-template-columns: 12px 72px 1fr 40px; align-items: center; gap: 8px; }
.stat .eff { grid-column: 3 / 5; font-size: 11.5px; color: var(--dim); margin-top: -5px; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0; }
.kv div { background: var(--card2); border: 1.5px solid var(--soft); border-radius: 12px; padding: 8px 10px; }
.kv dt { font-size: 11px; color: var(--dim); font-weight: 700; }
.kv dd { margin: 0; font-weight: 800; font-size: 16px; }
.avatar { display: flex; gap: 14px; align-items: center; }
.avatar .ava-big { width: 112px; height: 112px; border-radius: 20px; background: var(--card2); border: 2px solid var(--edge); flex: none; }
.avatar .ava-big svg { width: 100%; height: 100%; display: block; }
.cname { font-family: var(--font-display); font-size: 24px; line-height: 1.1; }
.item { display: flex; align-items: center; gap: 10px; }
.item .ic { width: 38px; height: 38px; border-radius: 10px; background: color-mix(in srgb, currentColor 12%, var(--card)); display: grid; place-items: center; flex: none; border: 2px solid currentColor; }
.item .ic svg { width: 20px; height: 20px; }
.item .in { font-weight: 800; font-size: 13.5px; }
.item .is { font-size: 11.5px; color: var(--dim); }
.reward { display: flex; align-items: center; gap: 8px; background: var(--card); border: 2px solid var(--edge); border-radius: 14px; box-shadow: var(--sh-sm); padding: 10px 10px 10px 12px; }
.r0 { color: var(--r0); } .r1 { color: var(--r1); } .r2 { color: var(--r2); } .r3 { color: var(--r3); }
.up { color: var(--ok); } .down { color: var(--danger); }

/* 입력 */
.inp { font: inherit; color: var(--fg); background: var(--card); border: 2px solid var(--edge); border-radius: 12px; padding: 8px 11px; min-width: 0; width: 100%; }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: var(--dim); min-width: 0; }
.dchips, .presets { display: flex; gap: 6px; flex-wrap: wrap; }
.dchip input, .seg input, .switch input { position: absolute; opacity: 0; pointer-events: none; }
.dchip span { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--card); border: 2px solid var(--edge); color: var(--dim); font-weight: 800; cursor: pointer; }
.dchip input:checked + span { background: var(--accent); color: var(--on-accent); box-shadow: var(--sh-sm); }
.dchip input:focus-visible + span, .seg input:focus-visible + span, .switch input:focus-visible + span { outline: 3px solid var(--int); outline-offset: 2px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

<script>
// ===== 전투 엔진 (화면과 분리: 자동전투·결과만 보기·승률 계산이 모두 같은 코드를 씀) =====
const DT = 1 / 60, W = 360, H = 600, WALL_Y = 492, HERO_Y = 540;

const RARITY = [
  { k: 'common', name: '일반', m: 1 },
  { k: 'rare', name: '희귀', m: 1.35 },
  { k: 'epic', name: '영웅', m: 1.8 },
  { k: 'legend', name: '전설', m: 2.5 },
];

const CHAPTERS = [
  { name: '1주차', boss: '미루기 대마왕' },
  { name: '2주차', boss: '야식 드래곤' },
  { name: '3주차', boss: '만성피로의 리치' },
];
const TILE_PATTERN = [
  ['battle', 'battle', 'gold', 'battle', 'gate', 'chest', 'battle', 'boss'],
  ['battle', 'gold', 'battle', 'chest', 'gate', 'battle', 'gold', 'boss'],
  ['battle', 'chest', 'battle', 'gold', 'gate', 'battle', 'chest', 'boss'],
];
const GATE_LV = [3, 6, 9];
const TILE_INFO = {
  battle: { name: '일반 웨이브' },
  gold: { name: '보물 칸' },
  chest: { name: '상자 칸' },
  gate: { name: '관문' },
  boss: { name: '주간 보스' },
};
const TILES = [];
TILE_PATTERN.forEach((row, c) => row.forEach((type, j) => TILES.push({ i: TILES.length, ch: c, j, type, gate: type === 'gate' ? GATE_LV[c] : 0 })));

const ENEMY = {
  slime: { name: '귀찮음 슬라임', hp: 1, spd: 36, dmg: 1, r: 14 },
  bat: { name: '미루기 박쥐', hp: 0.55, spd: 66, dmg: 0.7, r: 11 },
  golem: { name: '야식 골렘', hp: 3.4, spd: 21, dmg: 2.6, r: 20 },
  ghost: { name: '늦잠 유령', hp: 1.5, spd: 44, dmg: 1.3, r: 14 },
  boss: { name: '보스', hp: 45, spd: 13, dmg: 14, r: 32 },
};

const CLASSES = {
  novice: { name: '견습 모험가', stat: null, desc: '가장 높은 능력치가 25 이상이 되면 전직해요' },
  berserker: { name: '버서커', stat: 'str', desc: '탄환이 적 1명을 관통하고 공격력 +15%' },
  archmage: { name: '아크메이지', stat: 'int', desc: '지혜의 파동 피해 +60%, 재사용 25% 단축' },
  guardian: { name: '가디언', stat: 'vit', desc: '방벽 체력 +30%, 초당 0.6% 회복' },
  ranger: { name: '레인저', stat: 'dex', desc: '연사 속도 +25%, 치명타 확률 +10%p' },
};

const BAL = {
  hpBase: 80, hpLin: 0.22, hpPow: 1.7, dmgBase: 16, dmgLin: 0.07,
  countBase: 7, countGrow: 0.25, countWave: 3, gapBase: 0.75, gapTile: 0.004, gapMin: 0.38,
  goldBase: 18, goldGrow: 1.12,
};

// 칸별 권장 전투력: 균형 성장 모델로 자동전투 승률 75%가 되는 지점을 시뮬레이션해서 뽑은 값
const REC_CP = [100, 115, 130, 190, 280, 290, 305, 340, 350, 385, 395, 420, 530, 540, 550, 620, 630, 655, 665, 755, 855, 865, 875, 920];

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

function expNeed(level) { return Math.round(100 * Math.pow(1.3, level - 1)); }

function classOf(p) {
  const order = [['str', 'berserker'], ['int', 'archmage'], ['vit', 'guardian'], ['dex', 'ranger']];
  let best = order[0];
  for (const o of order) if (p[o[0]] > p[best[0]]) best = o;
  return p[best[0]] >= 25 ? best[1] : 'novice';
}
function gear(p, slot) { const id = p.eq[slot]; return id ? p.inv.find((x) => x.id === id) || null : null; }

function combat(p) {
  const c = classOf(p);
  const w = gear(p, 'weapon'), a = gear(p, 'armor'), ch = gear(p, 'charm');
  let atk = (p.str * 2 + p.level * 5 + (w ? w.atk : 0)) * (1 + p.enh * 0.1);
  let rate = 1.6 + p.dex * 0.02 + (ch ? ch.rate : 0);
  let crit = 0.05 + p.dex * 0.002 + (ch ? ch.crit : 0);
  let wall = 100 + p.vit * 12 + (a ? a.hp : 0);
  let wave = p.int * 3 + p.level * 3, waveCd = 5, pierce = 0, regen = 0;
  if (c === 'berserker') { atk *= 1.15; pierce = 1; }
  if (c === 'archmage') { wave *= 1.6; waveCd *= 0.75; }
  if (c === 'guardian') { wall *= 1.3; regen = 0.006; }
  if (c === 'ranger') { rate *= 1.25; crit += 0.1; }
  return { cls: c, atk: Math.round(atk), rate: Math.round(rate * 100) / 100, crit: Math.min(0.6, crit), wall: Math.round(wall), wave: Math.round(wave), waveCd, pierce, regen };
}
function cpOf(p) {
  const g = ['weapon', 'armor', 'charm'].reduce((s, k) => { const it = gear(p, k); return s + (it ? it.power : 0); }, 0);
  return Math.round((p.str + p.int + p.vit + p.dex) * 2 + p.level * 15 + g + p.enh * 12);
}

function tileScale(i) { return { hp: BAL.hpBase * Math.pow(1 + BAL.hpLin * i, BAL.hpPow), dmg: BAL.dmgBase * (1 + BAL.dmgLin * i) }; }

function pickType(tile, w, rng) {
  const pool = [['slime', 5], ['bat', 3]];
  if (tile.ch > 0 || tile.j >= 3) pool.push(['golem', 1.2 + w * 0.5]);
  if (tile.ch > 0) pool.push(['ghost', 2.5]);
  if (tile.ch > 1) pool.push(['golem', 1]);
  let tot = 0; for (const x of pool) tot += x[1];
  let r = rng() * tot;
  for (const x of pool) { r -= x[1]; if (r <= 0) return x[0]; }
  return 'slime';
}

function buildWaves(tile, rng) {
  const i = tile.i, nW = 3, list = [];
  let t = 1.2;
  for (let w = 0; w < nW; w++) {
    const n = Math.round((BAL.countBase + i * BAL.countGrow + w * BAL.countWave) * (tile.type === 'gold' ? 1.25 : 1) * (tile.type === 'gate' ? 1.15 : 1));
    const gap = Math.max(BAL.gapMin, BAL.gapBase - i * BAL.gapTile - w * 0.07);
    for (let k = 0; k < n; k++) {
      list.push({ t, type: pickType(tile, w, rng), x: 26 + rng() * (W - 52), w });
      t += gap * (0.6 + rng() * 0.8);
    }
    t += 3;
  }
  if (tile.type === 'boss') list.push({ t, type: 'boss', x: W / 2, w: nW });
  return { list, nW: nW + (tile.type === 'boss' ? 1 : 0) };
}

function newBattle(p, tile, seed, auto) {
  const rng = mulberry32(seed), cs = combat(p), wv = buildWaves(tile, rng);
  return {
    tile, seed, rng, cs, list: wv.list, nW: wv.nW, sc: tileScale(tile.i), elite: tile.type === 'gate' ? 1.3 : 1,
    idx: 0, t: 0, wall: cs.wall, wallMax: cs.wall, hx: W / 2, inputX: null, auto: auto !== false,
    cd: 0, waveT: cs.waveCd * 0.6, enemies: [], bullets: [], kills: 0, wave: 0, done: false, win: false, fx: null, nid: 0,
    bossName: CHAPTERS[tile.ch].boss,
  };
}

function hurt(b, e, dm, crit, kind) {
  e.hp -= dm;
  if (b.fx) b.fx('dmg', e, dm, crit, kind);
  if (e.hp <= 0) { b.kills++; if (b.fx) b.fx('kill', e); }
}

function step(b) {
  b.t += DT;
  while (b.idx < b.list.length && b.list[b.idx].t <= b.t) {
    const s = b.list[b.idx++], d = ENEMY[s.type], hp = d.hp * b.sc.hp * b.elite;
    b.enemies.push({ id: b.nid++, type: s.type, x: s.x, y: -d.r, hp, max: hp, spd: d.spd, dmg: d.dmg * b.sc.dmg, r: d.r, ph: b.rng() * 6.283 });
    if (s.w + 1 > b.wave) b.wave = s.w + 1;
  }

const ITEM_NAMES = {

function makeItem(tileI, rarity, rng, slot) {
  if (!slot) { const r = rng(); slot = r < 0.45 ? 'weapon' : r < 0.8 ? 'armor' : 'charm'; }
  const m = RARITY[rarity].m, it = { id: 'i' + Math.floor(rng() * 1e9).toString(36) + tileI, slot, rarity, lv: tileI + 1 };
  it.name = ITEM_NAMES[slot][Math.min(5, Math.floor(tileI / 4))];
  if (slot === 'weapon') { it.atk = Math.round((4 + tileI * 2.4) * m); it.power = it.atk * 2; }
  if (slot === 'armor') { it.hp = Math.round((20 + tileI * 10) * m); it.power = Math.round(it.hp * 0.4); }
  if (slot === 'charm') {
    it.crit = Math.round((0.02 + tileI * 0.002) * m * 1000) / 1000;
    it.rate = Math.round((0.1 + tileI * 0.02) * m * 100) / 100;
    it.power = Math.round(it.crit * 400 + it.rate * 60);

}

  let tot = 0; for (const x of weights) tot += x;
  let r = rng() * tot;
  for (let k = 0; k < weights.length; k++) { r -= weights[k]; if (r <= 0) return k; }
  return 0;
}

  const rng = mulberry32((seed ^ 0x9e3779b9) >>> 0);
  const base = BAL.goldBase * Math.pow(BAL.goldGrow, tile.i);
  const mult = { battle: 1, gate: 1.6, gold: 4, chest: 1, boss: 3 }[tile.type];
  const gold = Math.round(base * mult * (first ? 1 : 0.35));
  let item = null;
  if (first && tile.type === 'chest') item = makeItem(tile.i, rollRarity(rng, [40, 40, 15, 5]), rng);
  else if (first && tile.type === 'boss') item = makeItem(tile.i, rollRarity(rng, [0, 50, 38, 12]), rng);
  else if (rng() < (first ? 0.15 : 0.08)) item = makeItem(tile.i, rollRarity(rng, first ? [70, 25, 5, 0] : [80, 18, 2, 0]), rng);

// ===== 퀘스트 엔진 (화면과 분리: 목표 → 주간 분량 → 오늘의 퀘스트 → 기록 → 난이도 평가) =====
const QDAY = 86400000;
function ymd(d) { const z = (n) => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
function parseYmd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function diffDays(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / QDAY); }
function dow(s) { return parseYmd(s).getDay(); }
function weekStartOf(s) { return addDays(s, -((dow(s) + 6) % 7)); }

// 스몰스텝 적응 배율: 처음 2주는 25%, 6주까지 65%, 그 뒤 100%. 덜 한 양은 매주 재계산에서 자동으로 뒤로 분배됨
const STAGES = [
  { until: 2, f: 0.25, name: '착화기' },
  { until: 6, f: 0.65, name: '적응기' },
  { until: 1e9, f: 1, name: '본궤도' },
];
const TIER_REWARD = [null, { exp: 40, gold: 25, stat: 3 }, { exp: 72, gold: 45, stat: 5 }, { exp: 130, gold: 80, stat: 8 }];
const TIER_NAME = [null, '입문', '숙련', '마스터'];
const WEEKLY_REWARD = { exp: 100, gold: 120, tickets: 2 };
const SUB_REWARD = { exp: 20, gold: 15 }, SUB_DAILY_CAP = 3;
const OVERLOAD = 1.5; // 하루 분량이 원래 속도의 1.5배를 넘으면 더 올리지 않고 목표 조정을 제안

function stageOf(goal, ws) {
  if (goal.mode === 'FLAT') return { f: 1, name: '균등' };
  const w = Math.max(0, Math.floor(diffDays(goal.start, ws) / 7));
  return STAGES.find((s) => w < s.until);
}
function stepOf(unit) { return unit === 'km' || unit === '시간' ? 0.5 : 1; }
function roundStep(v, step) { return Math.round(v / step) * step; }

function goalDoneBefore(q, goal, date) {
  let s = 0;
  for (const x of q.quests) if (x.goalId === goal.id && x.status === 'done' && x.date < date) s += x.done;
  return s;
}

function goalDays(q, goal, from, to) {
  const rs = q.routines.filter((r) => r.goalId === goal.id && r.active);
  let n = 0;
  for (let d = from; d <= to; d = addDays(d, 1)) for (const r of rs) if (r.days.includes(dow(d)) && d >= r.created) n++;
  return n;
}

// 이번 주 분량 = (남은 양 ÷ 남은 기간) × 이번 주 길이 × 적응 배율 → 루틴 요일 수로 나눠 하루 분량
function planWeek(q, goal, ws) {

  if (q.plans[key]) return q.plans[key];
  const from = ws < goal.start ? goal.start : ws, we = addDays(ws, 6), to = we > goal.end ? goal.end : we;
  const remaining = Math.max(0, goal.total - goalDoneBefore(q, goal, from));
  const weeksLeft = Math.max(1 / 7, (diffDays(from, goal.end) + 1) / 7);
  const span = (diffDays(from, to) + 1) / 7;
  const pace = goal.total / ((diffDays(goal.start, goal.end) + 1) / 7);
  const st = stageOf(goal, ws);
  let target = (remaining / weeksLeft) * span * st.f, behind = false;
  if (target > pace * span * OVERLOAD) { target = pace * span * OVERLOAD; behind = true; }
  const days = goalDays(q, goal, from, to), step = stepOf(goal.unit);
  const perDay = days && remaining > 0 ? Math.max(step, roundStep(target / days, step)) : 0;
  const plan = { ws, from, to, perDay, days, target: roundStep(perDay * days, step), stage: st.name, f: st.f, behind, remaining };

}

function ensureDay(q, date) {
  for (const r of q.routines) {
    if (!r.active || !r.days.includes(dow(date)) || date < r.created) continue;
    const id = r.id + '@' + date;
    if (q.quests.some((x) => x.id === id)) continue;
    let amount = r.amount || 1, unit = r.unit || '회';
    const goal = r.goalId ? q.goals.find((g) => g.id === r.goalId) : null;
    if (goal) {
      if (date < goal.start || date > goal.end) continue;
      amount = planWeek(q, goal, weekStartOf(date)).perDay; unit = goal.unit;
      if (!amount) continue;
    }
    q.quests.push({ id, rid: r.id, goalId: goal ? goal.id : null, date, amount, unit, tier: r.tier, status: 'todo', snooze: 0, done: 0 });

    .sort((a, b) => (a.date < b.date ? -1 : 1));
}

// 앱을 열 때마다 호출: 빠진 날짜를 채우고, 지난 할 일은 '놓침'으로, 2일 연속 놓치면 난이도 한 단계 완화, 오늘 퀘스트 생성
function syncDays(q) {
  const today = q.today, notes = [];
  let start = q.lastGen ? addDays(q.lastGen, 1) : today;
  if (diffDays(start, today) > 30) start = addDays(today, -30);
  for (let d = start; d < today; d = addDays(d, 1)) ensureDay(q, d);
  for (const x of q.quests) if (x.status === 'todo' && x.date < today) x.status = 'missed';
  for (const r of q.routines) {
    const last2 = routineHistory(q, r, today, false).slice(-2);
    if (r.tier > 1 && last2.length === 2 && last2.every((x) => x.status === 'missed')) {
      r.tier--; r.tierSince = today;
      notes.push(`'${r.title}'을(를) 2번 연속 놓쳐서 난이도를 ${TIER_NAME[r.tier]}(으)로 낮췄어요. 연속 기록은 지켜져요.`);
    }

}

// 1달 목표: 지난 주들은 실제 주간 계획, 이번 주 이후는 이번 주 하루 분량으로 예상

let toastT = 0;
function toast(msg) {

  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2200);

// ===== 전투 화면의 캐릭터 그리기 =====
const CLASS_COLOR = { novice: '--r0', berserker: '--str', archmage: '--int', guardian: '--vit', ranger: '--dex' };
function drawHero(g, x, y, s, cls, t) {
  const im = SPR['h-' + cls];
  if (ready(im)) { const sz = 64 * s; g.drawImage(im, x - sz / 2, y + 15 - sz * 0.93 + Math.sin((t || 0) * 8) * 1.2, sz, sz); return; }
  const col = css(CLASS_COLOR[cls]);
  g.save(); g.translate(x, y); g.scale(s, s);
  g.fillStyle = col; g.beginPath(); g.moveTo(-11, 13); g.quadraticCurveTo(-12, -4, 0, -5); g.quadraticCurveTo(12, -4, 11, 13); g.closePath(); g.fill();
  g.fillStyle = '#f3d9c2'; g.beginPath(); g.arc(0, -11, 7.5, 0, 7); g.fill();
  g.restore();
}

// ===== 전투 =====
let B = null, raf = 0, last = 0, acc = 0, speed = 1, fxs = [], shake = 0, manualToast = false, finishing = false;
const cv = $('cv'), g = cv.getContext('2d');
let scale = 1;
function fitCanvas() {
  const wrap = $('cvwrap'), aw = wrap.clientWidth - 16, ah = wrap.clientHeight - 4;
  scale = Math.max(0.3, Math.min(aw / W, ah / H));
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  g.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
function battleFx(kind, e, dm, crit, src) {
  if (kind === 'dmg') e.fl = 0.12;
  if (kind === 'dmg' && src === 'shot') fxs.push({ k: 'num', x: e.x + (Math.random() - 0.5) * 10, y: e.y - e.r, v: Math.round(dm), crit, t: 0 });
  if (kind === 'dmg' && src === 'wave') fxs.push({ k: 'num', x: e.x, y: e.y - e.r, v: Math.round(dm), wave: true, t: 0 });
  if (kind === 'kill') for (let k = 0; k < 7; k++) { const a = Math.random() * 6.283, v = 40 + Math.random() * 80; fxs.push({ k: 'pt', x: e.x, y: e.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, c: enemyColor(e.type) }); }
  if (kind === 'wallhit') { shake = 0.25; fxs.push({ k: 'hit', x: e.x, t: 0 }); }
  if (kind === 'wave') fxs.push({ k: 'ring', t: 0 });
}
function enemyColor(type) { return { slime: '#7fd1b9', bat: '#9b87f5', golem: '#c98a5a', ghost: '#d6dcff', boss: css('--danger') }[type]; }

function openBattle(tile, auto) {
  const seed = S.seed++; S.tickets--; save();
  B = newBattle(S, tile, seed, auto); B.fx = battleFx; B.first = !S.cleared[tile.i];
  fxs = []; acc = 0; speed = 1; shake = 0; manualToast = false; finishing = false;
  $('bTitle').textContent = `${CHAPTERS[tile.ch].name} ${tile.j + 1}번째 칸 · ${TILE_INFO[tile.type].name}`;
  $('battle').hidden = false; closeModal(); updateBattleCtl();
  fitCanvas(); last = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
}
function updateBattleCtl() {
  $('bAuto').textContent = B.auto ? '자동전투 켜짐' : '자동전투 꺼짐';
  $('bAuto').classList.toggle('on', B.auto);
  $('bSpeed').textContent = speed + '배속';
  $('bHint').textContent = B.auto ? '화면을 좌우로 끌면 직접 조작으로 바뀌어요' : '좌우로 끌어서 조준해요. 사격은 자동이에요';
}
function loop(now) {
  if (!B) return;
  let dt = Math.min(0.1, (now - last) / 1000); last = now;
  acc += dt * speed;
  while (acc >= DT && !B.done) { step(B); acc -= DT; }
  for (const f of fxs) f.t += dt;
  for (const e of B.enemies) if (e.fl > 0) e.fl -= dt;
  fxs = fxs.filter((f) => f.t < (f.k === 'ring' ? 0.5 : f.k === 'pt' ? 0.5 : 0.7));
  shake = Math.max(0, shake - dt);
  drawBattle(now / 1000);
  if (B.done && !finishing) { finishing = true; setTimeout(() => finishBattle(), 700); }
  raf = requestAnimationFrame(loop);
}
function drawBattle(time) {
  const b = B;
  g.save();
  if (shake > 0) g.translate((Math.random() - 0.5) * 8 * shake / 0.25, (Math.random() - 0.5) * 4 * shake / 0.25);
  g.fillStyle = '#191729'; g.fillRect(-10, -10, W + 20, H + 20);
  const grd = g.createLinearGradient(0, 0, 0, 160); grd.addColorStop(0, 'rgba(255,107,94,.12)'); grd.addColorStop(1, 'rgba(255,107,94,0)');
  g.fillStyle = grd; g.fillRect(0, 0, W, 160);
  g.strokeStyle = 'rgba(255,255,255,.04)'; g.lineWidth = 1;
  for (let x = 45; x < W; x += 45) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, WALL_Y); g.stroke(); }
  // 적
  for (const e of b.enemies) drawEnemy(e, time);
  // 방벽
  const ratio = b.wall / b.wallMax, wc = ratio > 0.5 ? css('--ok') : ratio > 0.25 ? css('--gold') : css('--danger');
  for (let x = 0; x < W; x += 30) { g.fillStyle = wc; g.globalAlpha = 0.85; roundRect(x + 2, WALL_Y, 26, 12, 3); g.fill(); }
  g.globalAlpha = 1;
  g.fillStyle = 'rgba(255,255,255,.05)'; g.fillRect(0, WALL_Y + 14, W, H - WALL_Y);
  // 탄
  g.strokeStyle = css('--gold'); g.lineWidth = 3; g.lineCap = 'round';
  for (const bl of b.bullets) { g.beginPath(); g.moveTo(bl.x, bl.y); g.lineTo(bl.x, bl.y + 10); g.stroke(); }
  drawHero(g, b.hx, HERO_Y, 1.1, b.cs.cls, time);
  // 효과
  for (const f of fxs) {
    if (f.k === 'pt') { g.globalAlpha = 1 - f.t / 0.5; g.fillStyle = f.c; g.fillRect(f.x + f.vx * f.t - 2, f.y + f.vy * f.t - 2, 4, 4); }
    if (f.k === 'hit') { g.globalAlpha = 1 - f.t / 0.7; g.fillStyle = css('--danger'); g.fillRect(f.x - 20, WALL_Y - 4, 40, 20); }
    if (f.k === 'ring') { g.globalAlpha = 1 - f.t / 0.5; g.strokeStyle = css('--int'); g.lineWidth = 4; g.beginPath(); g.arc(b.hx, HERO_Y, 40 + f.t * 1100, 0, 7); g.stroke(); }
    if (f.k === 'num') {
      g.globalAlpha = 1 - f.t / 0.7; g.textAlign = 'center';
      g.font = `${f.crit ? 800 : 600} ${f.crit ? 15 : 11}px ${css('--font-body')}`;
      g.fillStyle = f.wave ? css('--int') : f.crit ? css('--gold') : '#fff';
      g.fillText(fmt(f.v) + (f.crit ? '!' : ''), f.x, f.y - f.t * 40);
    }
  }
  g.globalAlpha = 1;
  g.restore();
  // HUD
  $('bWave').textContent = `웨이브 ${Math.max(1, b.wave)}/${b.nW} · 처치 ${b.kills}`;
  $('bWallI').style.width = Math.max(0, ratio * 100) + '%';
  $('bWallI').style.background = wc;
  $('bWallT').textContent = `방벽 ${fmt(b.wall)} / ${fmt(b.wallMax)}`;
}
function roundRect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
const FOE_SIZE = { slime: 44, bat: 44, golem: 56, ghost: 46, boss: 108 };
function drawEnemy(e, time) {
  const r = e.r, im = SPR[e.type === 'boss' ? 'b-' + B.tile.ch : 'm-' + e.type];
  g.save(); g.translate(e.x, e.y);
  if (ready(im)) {
    const sz = FOE_SIZE[e.type], ph = time + e.id * 0.7;
    if (e.type === 'slime') { const q = 1 + Math.sin(ph * 6) * 0.07; g.scale(q, 1 / q); }
    else if (e.type === 'bat') { g.translate(0, Math.sin(ph * 10) * 3); g.scale(1 + Math.sin(ph * 16) * 0.06, 1); }
    else if (e.type === 'golem') g.rotate(Math.sin(ph * 3) * 0.07);
    else if (e.type === 'ghost') { g.translate(0, Math.sin(ph * 4) * 3); g.globalAlpha = 0.92; }
    else g.translate(0, Math.sin(ph * 2) * 2);
    g.drawImage(im, -sz / 2, -sz / 2, sz, sz);
    if (e.fl > 0) { g.globalAlpha = Math.min(0.45, e.fl * 4); g.globalCompositeOperation = 'lighter'; g.drawImage(im, -sz / 2, -sz / 2, sz, sz); g.globalCompositeOperation = 'source-over'; }
  } else {
    g.fillStyle = enemyColor(e.type); g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill();
  }
  g.restore();
  if (e.hp < e.max) { const w = Math.max(24, r * 1.8); g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(e.x - w / 2, e.y - r - 12, w, 4); g.fillStyle = css('--danger'); g.fillRect(e.x - w / 2, e.y - r - 12, w * Math.max(0, e.hp / e.max), 4); }
  if (e.type === 'boss') { g.fillStyle = '#fff'; g.font = `700 12px ${css('--font-body')}`; g.textAlign = 'center'; g.fillText(B.bossName, e.x, e.y - FOE_SIZE.boss / 2 - 8); }
}
function toWorldX(ev) { const rc = cv.getBoundingClientRect(); return ((ev.clientX - rc.left) / rc.width) * W; }
cv.addEventListener('pointerdown', (ev) => { if (!B || B.done) return; cv.setPointerCapture(ev.pointerId); takeControl(ev); });
cv.addEventListener('pointermove', (ev) => { if (!B || B.done || !cv.hasPointerCapture(ev.pointerId)) return; takeControl(ev); });
function takeControl(ev) {
  B.inputX = toWorldX(ev);
  if (B.auto) { B.auto = false; updateBattleCtl(); if (!manualToast) { manualToast = true; toast('직접 조작으로 바꿨어요'); } }
}
$('bAuto').onclick = () => { if (!B || B.done) return; B.auto = !B.auto; B.inputX = B.hx; updateBattleCtl(); };
$('bSpeed').onclick = () => { if (!B) return; speed = speed === 1 ? 2 : speed === 2 ? 3 : 1; updateBattleCtl(); };
$('bSkip').onclick = () => { if (!B || B.done) return; B.auto = true; B.fx = null; simulate(B); finishing = true; finishBattle(); };
window.addEventListener('resize', () => { if (B) fitCanvas(); });

function finishBattle() {
  const b = B; if (!b) return;
  cancelAnimationFrame(raf); B = null; $('battle').hidden = true;
  showResult(applyResult(b), b);
}
// 결과만 보기: 화면 없이 같은 엔진으로 자동전투를 끝까지 돌림 → 자동전투를 끝까지 본 것과 결과가 같음
function skipBattle(tile) {
  const seed = S.seed++; S.tickets--;
  const b = newBattle(S, tile, seed, true); b.first = !S.cleared[tile.i];
  simulate(b);
  showResult(applyResult(b), b);
}
function applyResult(b) {
  const t = b.tile, out = { win: b.win, gold: 0, item: null, unlocked: false };
  if (b.win) {
    const r = rewardFor(t, b.first, b.seed);
    out.gold = r.gold; out.item = r.item;
    if (b.first) { S.cleared[t.i] = true; out.unlocked = true; }
  } else {
    out.gold = Math.round(BAL.goldBase * Math.pow(BAL.goldGrow, t.i) * 0.15);
  }
  S.gold += out.gold;
  if (out.item) S.inv.push(out.item);
  save(); render();
  return out;
}

// ===== 시트 =====
function closeModal() { stopRing(); $('modal').innerHTML = ''; }
function openModal(html) {
  $('modal').innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const first = $('modal').querySelector('button'); if (first) first.focus({ preventScroll: true });
}
function openTile(i) {
  const t = TILES[i], cur = curTile();
  if (i > cur) { toast('앞 칸을 먼저 깨야 열려요'); return; }
  const first = !S.cleared[i], cp = myCp(), rec = REC_CP[i];
  const lvBlock = t.gate && S.level < t.gate && first;
  const noTicket = S.tickets <= 0;
  const r = rewardFor(t, first, 0);
  const itemTxt = first && t.type === 'chest' ? '장비 상자 확정' : first && t.type === 'boss' ? '희귀 이상 장비 확정' : `장비 낮은 확률(${first ? 15 : 8}%)`;
  let h = `<div class="eyebrow">${CHAPTERS[t.ch].name} · ${t.j + 1}번째 칸${first ? '' : ' · 이미 깬 칸'}</div>
    <div class="row"><div class="ic" style="width:28px;color:${t.type === 'gold' ? 'var(--gold)' : t.type === 'chest' ? 'var(--r2)' : t.type === 'gate' ? 'var(--int)' : t.type === 'boss' ? 'var(--danger)' : 'var(--fg)'}">${ICON[t.type]}</div><div class="big">${TILE_INFO[t.type].name}</div></div>
    <div class="sub">${tileDesc(t)}${first ? '' : ' 다시 하면 보상이 35%로 줄어요(파밍).'}</div>
    <div class="foes">${foesOf(t).map((k) => k === 'boss' ? `<span class="foe boss">${artInline(BOSS[t.ch], '')}<small>${CHAPTERS[t.ch].boss}</small></span>` : `<span class="foe">${artInline(MON[k], '')}<small>${ENEMY[k].name}</small></span>`).join('')}</div>
    <dl class="kv" style="margin:0">
      <div><dt>권장 전투력</dt><dd class="num">${fmt(rec)}</dd></div>
      <div><dt>내 전투력</dt><dd class="num ${cp >= rec ? 'okc' : 'badc'}">${fmt(cp)}</dd></div>
      <div><dt>자동전투 예상 승률</dt><dd class="num" id="wr">계산 중…</dd></div>
      <div><dt>승리 보상</dt><dd class="num" style="font-size:13px">골드 ${fmt(r.gold)}<br><span class="sub">${itemTxt}</span></dd></div>
    </dl>`;
  if (lvBlock) h += `<div class="warn">Lv.${t.gate} 이상만 들어갈 수 있어요. 지금 Lv.${S.level}이에요. 루틴을 완료해 레벨을 올려주세요.</div>`;
  else if (noTicket) h += '<div class="warn">입장권이 없어요. 루틴을 1개 완료하면 1장 받아요.</div>';
  else h += `<div class="sub">입장권 1장을 써요 (남은 입장권 ${S.tickets}장). 결과만 보기는 자동전투를 끝까지 본 것과 같은 결과가 나와요.</div>`;
  const dis = lvBlock || noTicket ? 'disabled' : '';
  h += `<div class="modes">
      <button class="btn" data-mode="manual" ${dis}>직접 전투<small>좌우로 끌어 조준</small></button>
      <button class="btn pri" data-mode="auto" ${dis}>자동 전투<small>보면서 자동</small></button>
      <button class="btn" data-mode="skip" ${dis}>결과만 보기<small>바로 결과</small></button>
    </div>`;
  if (lvBlock || noTicket) h += '<button class="btn" data-act="goroutine">퀘스트 하러 가기</button>';
  h += '<button class="btn" data-act="close">닫기</button>';
  openModal(h);
  $('modal').querySelector('.sheet').dataset.tile = i;
  setTimeout(() => {
    const el = $('wr'); if (!el) return;
    const w = winRate(S, t, S.seed, 16);
    el.textContent = Math.round(w * 100) + '%';
    el.className = 'num ' + (w >= 0.7 ? 'okc' : w < 0.4 ? 'badc' : '');
  }, 30);
}

function foesOf(t) { const f = ['slime', 'bat']; if (t.ch > 0 || t.j >= 3) f.push('golem'); if (t.ch > 0) f.push('ghost'); if (t.type === 'boss') f.push('boss'); return f; }
function weakestStat() { return ['str', 'int', 'vit', 'dex'].reduce((a, k) => (S[k] < S[a] ? k : a), 'str'); }
function showResult(out, b) {
  const t = b.tile, cp = myCp(), rec = REC_CP[t.i];
  let h = `<div class="eyebrow">${CHAPTERS[t.ch].name} · ${t.j + 1}번째 칸 · ${TILE_INFO[t.type].name}</div>
    <div class="big" style="color:${out.win ? 'var(--gold)' : 'var(--danger)'}">${out.win ? '승리' : '방벽이 무너졌어요'}</div>
    <dl class="kv" style="margin:0">
      <div><dt>도달 웨이브</dt><dd class="num">${Math.max(1, b.wave)} / ${b.nW}</dd></div>
      <div><dt>처치</dt><dd class="num">${b.kills}</dd></div>
      <div><dt>남은 방벽</dt><dd class="num">${Math.round((b.wall / b.wallMax) * 100)}%</dd></div>
      <div><dt>${out.win ? '획득 골드' : '위로금'}</dt><dd class="num" style="color:var(--gold)">+${fmt(out.gold)}</dd></div>
    </dl>`;
  if (out.item) {
    const d = cpWith(out.item) - cp;
    h += `<div class="sub">장비 획득</div>${itemRow(out.item, d > 0 ? `<button class="btn sm pri" data-equip="${out.item.id}" data-close="1">장착 +${d}</button>` : '')}`;
  }
  if (out.win && out.unlocked) {
    const nx = TILES[t.i + 1];
    h += `<div class="okc" style="font-weight:700">${t.type === 'boss' ? `${CHAPTERS[t.ch].name} 지도를 모두 깼어요!` : '다음 칸이 열렸어요.'}${nx && nx.gate ? ` 다음은 관문이에요(Lv.${nx.gate} 필요).` : ''}</div>`;
  }
  if (!out.win) {
    const k = weakestStat();
    h += `<div class="note">${cp < rec ? `권장 전투력까지 약 ${fmt(rec - cp)} 부족해요.` : '전투력은 충분해요. 직접 조작으로 다시 도전해보세요.'}
      가장 낮은 능력치는 ${STAT[k].name}(${STAT[k].eff})이에요. ${(() => { const rr = S.q && S.q.routines.find((r) => r.stat === k); return rr ? `'${rr.title}' 퀘스트로 올릴 수 있어요.` : `${STAT[k].name}을 올리는 루틴을 만들어 보세요.`; })()}</div>
      <button class="btn pri" data-act="goroutine">퀘스트 하러 가기</button>`;
  }
  h += `<button class="btn ${out.win ? 'pri' : ''}" data-act="close">지도로</button>`;
  S.tab = 'map'; render();
  openModal(h);
}

      h += `<div class="snooze"><div class="grow"><b>${esc(questText(sx))}</b><div class="sub num">미룸 · ${hm}에 다시 전화가 와요</div></div>
        <button class="btn sm pri" data-qact="recall">지금 받기</button><button class="btn sm" data-qact="unsnooze">취소</button></div>`;
    } else q.snoozed = null;

  const subsToday = q.subs.filter((s) => !s.done || s.doneDate === today);
  h += `<section class="sec"><div class="sec-h"><h2>부가 퀘스트</h2><span class="sub num">오늘 보상 ${Math.max(0, subRewardLeft(q))}/${SUB_DAILY_CAP}회 남음</span></div>

}

function questCard(x) {
  const q = Q(), r = routineOf(x.rid); if (!r) return '';
  const ti = tierInfo(r, x.tier), streak = streakOf(q, r), rate = recentRate(q, r);
  let h = `<article class="qcard ${x.status}" style="--c:var(--${r.stat})">
    <div class="qmain"><div class="qtime num">${r.time}</div>
      <div class="grow"><div class="qt">${esc(ti.title)}${x.goalId ? ` <span class="amt num">${amountText(x)}</span>` : ''}</div>
        <div class="tags"><span class="tag tier t${x.tier}">${TIER_NAME[x.tier]}</span><span class="tag tstat">${STAT[r.stat].name} +${TIER_REWARD[x.tier].stat}</span>
          <span class="tag">${r.mode === 'TIMER' ? `${ti.minutes}분 타이머` : '꾹 누르기'}</span>${streak ? `<span class="tag fire">${QICON.flame}${streak}</span>` : ''}${rate != null ? `<span class="tag">최근 ${Math.round(rate * 100)}%</span>` : ''}${x.snooze ? `<span class="tag">미룸 ${x.snooze}</span>` : ''}</div></div>`;
  if (x.status === 'todo') h += `<div class="qbtns"><button class="go" data-qact="start" data-q="${x.id}" aria-label="시작">${QICON.play}</button><button class="btn xs ghost" data-qact="snooze" data-q="${x.id}">미루기</button></div>`;
  else h += `<span class="qstate ${x.status}">${x.status === 'done' ? QICON.check : '놓침'}</span>`;
  h += '</div>';
  if (escalationReady(q, r)) {
    const a = TIER_REWARD[r.tier], b = TIER_REWARD[r.tier + 1], nt = tierInfo(r, r.tier + 1);
    h += `<div class="banner"><b>난이도를 올릴까요?</b> 최근 ${Math.round((rate || 0) * 100)}% · ${streak}번 연속 성공
      <div class="sub">다음: '${esc(nt.title)}'${r.mode === 'TIMER' ? ` · ${ti.minutes}분 → ${nt.minutes}분` : ''}</div>
      <div class="delta num">EXP +${a.exp}→<b>+${b.exp}</b> · 골드 +${a.gold}→<b>+${b.gold}</b> · ${STAT[r.stat].name} +${a.stat}→<b>+${b.stat}</b></div>
      <div class="row"><button class="btn sm pri" data-qact="up" data-r="${r.id}">올리기</button><button class="btn sm" data-qact="hold" data-r="${r.id}">지금 단계 유지</button></div></div>`;
  } else if (x.status !== 'missed') {
    const hint = escalationHint(q, r);
    if (hint) h += `<div class="hint-line">${hint}</div>`;
  }
  if (x.status === 'todo' && x.snooze >= 3) {
    h += r.tier > 1
      ? `<div class="banner soft">자꾸 미뤄지네요. 한 단계 쉬운 '${esc(tierInfo(r, r.tier - 1).title)}'(으)로 바꿔도 연속 기록은 지켜져요. <button class="btn sm" data-qact="down" data-r="${r.id}">난이도 낮추기</button></div>`
      : '<div class="banner soft">자꾸 미뤄지네요. 오늘은 딱 3분만 해도 성공으로 쳐요.</div>';
  }
  return h + '</article>';
}

function renderGoals() {
  const q = Q(), today = q.today;
  let h = `<section class="sec"><div class="sec-h"><h2>목표</h2><button class="btn sm pri" data-qact="new">새 루틴·목표</button></div><div class="list">`;

  for (const g of q.goals) {
    const done = goalDone(q, g), total = diffDays(g.start, g.end) + 1, el = Math.min(total, diffDays(g.start, today) + 1);
    const yp = Math.min(100, (done / g.total) * 100), exp = (el / total) * 100;
    const mo = monthInfo(q, g), w = weeklyOf(q, g), p = w.plan;
    const rs = q.routines.filter((r) => r.goalId === g.id);
    const bar = (v, t) => `<div class="bar"><i style="width:${t ? Math.min(100, (v / t) * 100) : 0}%"></i></div>`;
    h += `<article class="goal" style="--c:var(--${g.stat})">
      <div class="g-h"><div class="grow"><div class="eyebrow">${g.mode === 'FLAT' ? '균등 분배' : `스몰스텝 · ${p.stage} ${Math.round(p.f * 100)}%`}</div><h3>${esc(g.title)}</h3></div><span class="g-pct num">${yp.toFixed(1)}%</span></div>
      <div class="lvl"><span class="lv-k">1년</span><div class="grow"><div class="bar goalbar"><i style="width:${yp}%"></i><s style="left:${exp}%"></s></div></div><span class="num lv-v">${fmtAmt(done)} / ${fmt(g.total)}${g.unit}</span></div>
      ${mo ? `<div class="lvl"><span class="lv-k">${mo.month}월</span><div class="grow">${bar(mo.prog, mo.target)}</div><span class="num lv-v">${fmtAmt(mo.prog)} / ${fmtAmt(mo.target)}${g.unit}</span></div>` : ''}
      <div class="lvl"><span class="lv-k">이번 주</span><div class="grow">${bar(w.prog, p.target)}</div><span class="num lv-v">${fmtAmt(w.prog)} / ${fmtAmt(p.target)}${g.unit}</span></div>
      <div class="sub num">하루 ${fmtAmt(p.perDay)}${g.unit} × ${p.days}번 · 기간 ${el}/${total}일째. 1년 막대의 세로선은 똑같이 나눴을 때 지금쯤 와야 할 위치예요${g.mode === 'FLAT' ? '' : '(처음 6주는 일부러 적게 시작해요)'}.</div>
      <div class="g-routines">${rs.map((r) => `<span class="tag tstat">${r.time} ${esc(r.title)}</span>`).join('')}</div>
      ${w.complete && !w.claimed ? `<button class="btn pri" data-qact="weekly" data-g="${g.id}">이번 주 퀘스트 달성! 보상 받기 (EXP +${WEEKLY_REWARD.exp} · 골드 +${WEEKLY_REWARD.gold} · 입장권 +${WEEKLY_REWARD.tickets})</button>`
        : w.claimed ? '<div class="sub okc">이번 주 보상을 받았어요</div>' : `<div class="sub">이번 주 분량을 채우면 EXP +${WEEKLY_REWARD.exp} · 골드 +${WEEKLY_REWARD.gold} · 입장권 +${WEEKLY_REWARD.tickets}</div>`}
      ${p.behind ? `<div class="warn">밀린 양이 많아서 하루 분량을 원래 속도의 ${OVERLOAD}배로 묶었어요.</div><button class="btn sm" data-qact="adjust" data-g="${g.id}">남은 기간에 맞게 목표 낮추기</button>` : ''}
    </article>`;
  }
  h += '</div></section>';
  h += '<section class="sec"><div class="sec-h"><h2>루틴 관리</h2></div><div class="list">';
  for (const r of q.routines) {
    const g = r.goalId ? goalOf(r.goalId) : null;
    h += `<div class="rrow ${r.active ? '' : 'paused'}" style="--c:var(--${r.stat})"><span class="dot"></span><div class="grow"><b>${esc(r.title)}</b>${r.active ? '' : ' <span class="tag">쉬는 중</span>'} <span class="sub num">${r.time} · ${r.days.length === 7 ? '매일' : r.days.map((d) => WEEKDAY[d]).join('')} · ${MODE_NAME[r.mode]}</span>
      <div class="sub">${TIER_NAME[r.tier]} 단계: ${esc(tierInfo(r, r.tier).title)}${g ? ` · ${esc(g.title)}` : ''}</div></div>
      <div class="qbtns"><button class="btn xs" data-qact="edit" data-r="${r.id}">수정</button><button class="btn xs ghost" data-qact="del" data-r="${r.id}">삭제</button></div></div>`;
  }
  if (!q.routines.length) h += '<div class="empty">루틴이 없어요.</div>';

}

let execTimer = 0, holdTimer = 0, execPaused = false;
function openExec(x) {
  const r = routineOf(x.rid), g = x.goalId ? goalOf(x.goalId) : null, ti = tierInfo(r, x.tier);
  stopRing(); clearInterval(execTimer); execPaused = false;
  let h = `<div class="eyebrow">${r.time} · ${esc(r.title)} · ${TIER_NAME[x.tier]} 단계</div><div class="big">${esc(ti.title)}</div>`;
  if (g) h += `<div class="row amt-row"><span class="grow sub">오늘 한 양 (목표 ${amountText(x)})</span><button class="btn sm" data-qact="amt" data-d="-1" aria-label="줄이기">−</button><b class="num" id="amtV" data-v="${x.amount}" data-step="${stepOf(g.unit)}" data-unit="${g.unit}">${fmtAmt(x.amount)}${g.unit}</b><button class="btn sm" data-qact="amt" data-d="1" aria-label="늘리기">+</button></div>`;
  if (r.mode === 'TIMER') {
    h += `<div class="timer num" id="tmr" data-left="${ti.minutes * 60}" data-total="${ti.minutes * 60}" style="--p:0"><span id="tmrT">${String(ti.minutes).padStart(2, '0')}:00</span><small id="tmrS">집중 중</small></div>
      <div class="row"><button class="btn grow" data-qact="pause" id="pauseBtn">일시정지</button><button class="btn pri grow" data-qact="finish" data-q="${x.id}">끝냈어요</button></div>
      <div class="sub center">타이머가 0이 되면 자동으로 완료돼요. 먼저 끝냈으면 '끝냈어요'를 눌러요.</div>`;
  } else {
    h += `<button class="hold" id="holdBtn" data-q="${x.id}" style="--p:0">1.5초 꾹 눌러<br>완료 인증</button>`;
  }
  h += `<div class="sub center">${rewardLine(x.tier, r.stat)}</div><button class="btn ghost" data-qact="closeexec">나중에 하기</button>`;
  openModal(h);
  if (r.mode === 'TIMER') {
    execTimer = setInterval(() => {
      const el = $('tmr'); if (!el) { clearInterval(execTimer); return; }
      if (execPaused) return;
      const left = Math.max(0, +el.dataset.left - 1); el.dataset.left = left;
      el.style.setProperty('--p', 1 - left / +el.dataset.total);
      $('tmrT').textContent = `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}`;
      if (!left) { clearInterval(execTimer); finishQuest(x.id); }
    }, 1000);
  } else {
    const b = $('holdBtn');
    const stop = () => { cancelAnimationFrame(holdTimer); b.style.setProperty('--p', 0); };
    b.addEventListener('pointerdown', (ev) => {
      ev.preventDefault(); const t0 = performance.now(); tone(660, 'sine', 0.08, 0, 0.06);
      const tick = (now) => { const p = Math.min(1, (now - t0) / 1500); b.style.setProperty('--p', p); if (p >= 1) finishQuest(b.dataset.q); else holdTimer = requestAnimationFrame(tick); };
      holdTimer = requestAnimationFrame(tick);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((e) => b.addEventListener(e, stop));
  }
}

function finishQuest(qid) {
  const q = Q(), x = q.quests.find((y) => y.id === qid); if (!x || x.status !== 'todo') return;
  const r = routineOf(x.rid), el = $('amtV');
  const amt = el ? Math.max(0, +el.dataset.v) : x.amount;
  clearInterval(execTimer); cancelAnimationFrame(holdTimer);
  const rw = completeQuest(q, x, amt), g = grant({ ...rw, tickets: 1 }, r.stat);
  if (q.snoozed && q.snoozed.qid === qid) q.snoozed = null;
  q.example = false; save(); closeModal(); render();
  rewardToast(`${STAT[r.stat].name} +${rw.stat} · EXP +${rw.exp} · 골드 +${rw.gold} · 입장권 +1`, g);
}

function applyPreset(k) {

// 앞으로 7일 동안 울릴 모닝콜 목록 (이미 끝낸 퀘스트는 빼고). 앱이 꺼져 있어도 안드로이드가 이 시간에 깨워 줌
function upcomingAlarms() {
  const q = Q(); if (!q || !q.settings.autoRing || q.today !== realToday()) return [];
  const now = Date.now(), out = [];
  for (let k = 0; k < 7; k++) {
    const d = addDays(q.today, k), dt = parseYmd(d);
    for (const r of q.routines) {
      if (!r.active || !r.days.includes(dow(d)) || d < r.created) continue;
      const g = r.goalId ? goalOf(r.goalId) : null; if (g && (d < g.start || d > g.end)) continue;
      const x = q.quests.find((y) => y.id === r.id + '@' + d); if (x && x.status !== 'todo') continue;
      const [hh, mm] = r.time.split(':').map(Number), at = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate(), hh, mm).getTime();
      if (at <= now + 5000) continue;
      out.push({ id: hash32(r.id + '@' + d), at, questId: r.id + '@' + d, title: q.settings.caller, body: tierInfo(r, x ? x.tier : r.tier).title });
    }
  }
  if (q.snoozed && q.snoozed.until > now) {
    const x = q.quests.find((y) => y.id === q.snoozed.qid);
    if (x && x.status === 'todo') out.push({ id: hash32('snooze'), at: q.snoozed.until, questId: x.id, title: q.settings.caller, body: questText(x) + ' (다시 울림)' });
  }

}

  if (!QA) return;
  QA.addListener('call', (e) => handleNativeCall(e.questId, e.action));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) nativeResume(); });
  nativeResume(); onSaved();
}

function appHtml() {
  if (NATIVE) {
    const row = (k, ok, label, fix) => `<div class="perm"><span class="${ok ? 'ok' : 'no'}">${ok ? '켜짐' : '꺼짐'}</span><span class="grow">${label}</span>${ok ? '' : `<button class="btn xs" data-qact="perm" data-k="${k}">${fix}</button>`}</div>`;
    const p = perm || {};
    return `<section class="sec"><h2>안드로이드 모닝콜</h2><div class="card list">
      <div class="sub">앱이 꺼져 있어도 루틴 시간에 전화처럼 울리려면 아래 세 가지가 모두 켜져 있어야 해요.</div>
      ${row('notifications', p.notifications, '알림', '허용하기')}
      ${row('exactAlarm', p.exactAlarm, '정확한 시간에 알람', '설정 열기')}
      ${row('fullScreen', p.fullScreen, '잠금화면 위 전체 화면', '설정 열기')}
      <button class="btn sm" data-qact="testalarm">1분 뒤 테스트 전화 받기</button>
    </div></section>`;
  }
  return `<section class="sec"><h2>앱으로 쓰기</h2><div class="card list">
    ${installEvt ? '<button class="btn pri" data-qact="install">홈 화면에 설치하기</button>' : '<div class="sub">브라우저 메뉴(⋮)에서 "홈 화면에 추가" 또는 "앱 설치"를 누르면 앱처럼 쓸 수 있어요.</div>'}
    ${IS_ANDROID ? `<a class="btn" href="${APK_URL}" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">안드로이드 앱(APK) 받기</a><div class="sub">앱으로 설치하면 앱이 꺼져 있어도 모닝콜이 전화처럼 울려요. 설치 전에 아래 "백업"으로 기록을 옮겨 두세요.</div>` : ''}
  </div></section>`;
}

// ===== 백업: 기록을 코드(문자열)로 내보내고 다른 기기·앱에서 가져오기 =====
function b64(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
function unb64(str) { const s = atob(str); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; }
async function exportCode() {
  const json = JSON.stringify(S);
  if (window.CompressionStream) {
    const st = new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));
    return 'QC1:' + b64(new Uint8Array(await new Response(st).arrayBuffer()));
  }
  return 'QC0:' + b64(new TextEncoder().encode(json));
}
async function importCode(code) {
  code = code.trim();
  let obj;
  if (code.startsWith('QC1:')) obj = JSON.parse(await new Response(new Blob([unb64(code.slice(4))]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
  else if (code.startsWith('QC0:')) obj = JSON.parse(new TextDecoder().decode(unb64(code.slice(4))));
  else obj = JSON.parse(code);
  if (!obj || !Array.isArray(obj.cleared) || obj.cleared.length !== TILES.length || typeof obj.level !== 'number') throw new Error('bad');
  return obj;
}
function backupHtml() {
  const canDownload = !NATIVE && window.top === window;
  return `<section class="sec"><h2>백업</h2><div class="card list">
    <div class="sub">휴대폰을 바꾸거나 웹에서 앱으로 옮길 때 써요. 코드를 복사해 메모장이나 카톡 '나와의 채팅'에 보관하세요.</div>
    <div class="row"><button class="btn sm pri grow" data-qact="bkcopy">백업 코드 복사</button>${canDownload ? '<button class="btn sm grow" data-qact="bkfile">파일로 저장</button>' : ''}</div>
    <textarea id="bkIn" class="inp" placeholder="여기에 백업 코드를 붙여넣고 가져오기를 누르세요" aria-label="백업 코드"></textarea>
    <div class="row"><button class="btn sm grow" data-qact="bkimport">가져오기</button><label class="btn sm grow" style="text-align:center">파일 열기<input type="file" id="bkFile" accept=".txt,.json,text/plain" hidden></label></div>
    <div id="bkMsg" class="sub"></div>
  </div></section>`;
}
let pendingImport = null;
async function askImport(text) {
  try { pendingImport = await importCode(text); } catch (e) { $('bkMsg').textContent = '코드를 읽지 못했어요. 처음부터 끝까지 빠짐없이 붙여넣었는지 확인해 주세요.'; return; }
  $('bkMsg').innerHTML = `Lv.${pendingImport.level} 기록이에요. 지금 기록을 덮어써요. <button class="btn xs pri" data-qact="bkyes">덮어쓰기</button> <button class="btn xs" data-qact="bkno">취소</button>`;
}
document.addEventListener('change', (ev) => {
  if (ev.target.id !== 'bkFile' || !ev.target.files[0]) return;
  ev.target.files[0].text().then(askImport);
});
document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-qact]'); if (!el) return;
  const a = el.dataset.qact;
  if (a === 'install' && installEvt) { installEvt.prompt(); installEvt = null; render(); }
  else if (a === 'perm' && QA) { await QA.openSetting({ type: el.dataset.k }).catch(() => {}); }
  else if (a === 'testalarm' && QA) {
    const q = Q(), x = q.quests.find((y) => y.date === q.today && y.status === 'todo');
    if (!x) { toast('오늘 남은 퀘스트가 없어서 테스트할 수 없어요'); return; }
    await QA.schedule({ alarms: [...upcomingAlarms(), { id: hash32('test'), at: Date.now() + 60000, questId: x.id, title: q.settings.caller, body: questText(x) + ' (테스트)' }], snoozeMinutes: q.settings.snooze }).catch(() => {});
    toast('1분 뒤에 전화가 와요. 화면을 끄고 기다려 보세요');
  }
  else if (a === 'bkcopy') {
    const code = await exportCode();
    try { await navigator.clipboard.writeText(code); toast(`백업 코드를 복사했어요 (${Math.round(code.length / 1024)}KB)`); }
    catch (e) { const t = $('bkIn'); t.value = code; t.select(); toast('자동 복사가 안 돼서 아래 칸에 넣었어요. 길게 눌러 복사하세요'); }
  }
  else if (a === 'bkfile') {
    const code = await exportCode(), url = URL.createObjectURL(new Blob([code], { type: 'text/plain' }));
    const link = Object.assign(document.createElement('a'), { href: url, download: `questcall-backup-${Q().today}.txt` });
    document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  else if (a === 'bkimport') askImport($('bkIn').value);
  else if (a === 'bkno') { pendingImport = null; $('bkMsg').textContent = ''; }
  else if (a === 'bkyes' && pendingImport) { S = pendingImport; pendingImport = null; syncQuests(); save(); render(); toast('백업을 불러왔어요'); }
});
// ===== 오늘·목표 탭 끝 =====


// ===== 이벤트 =====
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('button, .scrim'); if (!el) return;
  if (el.classList.contains('scrim')) { if (ev.target === el) closeModal(); return; }
  const d = el.dataset;
  if (d.tab) { S.tab = d.tab; save(); render(); window.scrollTo(0, 0); return; }
  if (d.tile != null) { openTile(+d.tile); return; }
  if (d.mode) {
    const i = +el.closest('.sheet').dataset.tile, t = TILES[i];
    if (S.tickets <= 0) return;
    closeModal();
    if (d.mode === 'skip') skipBattle(t); else openBattle(t, d.mode === 'auto');
    return;
  }
  if (d.equip) {
    const it = S.inv.find((x) => x.id === d.equip); if (!it) return;
    S.eq[it.slot] = it.id; save(); render(); toast(`${it.name} 장착`);
    if (d.close) closeModal();
    return;
  }
  if (d.sell) {
    const it = S.inv.find((x) => x.id === d.sell); if (!it) return;
    S.inv = S.inv.filter((x) => x !== it); S.gold += sellPrice(it); save(); render(); toast(`${it.name} 판매 +${sellPrice(it)}G`);
    return;
  }
  if (d.buy != null) {
    const it = S.shop[+d.buy]; if (!it || S.gold < it.price) return;
    S.gold -= it.price; const own = { ...it }; delete own.price; S.inv.push(own);
    S.shop.splice(+d.buy, 1); save(); render(); toast(`${it.name} 구매`);
    return;
  }
  const a = d.act;
  if (a === 'close') closeModal();
  else if (a === 'goroutine') { closeModal(); S.tab = 'today'; save(); render(); window.scrollTo(0, 0); }
  else if (a === 'enh') { const c = enhCost(); if (S.gold < c) return; S.gold -= c; S.enh++; save(); render(); toast(`무기 +${S.enh} 강화 성공`); }
  else if (a === 'reroll') { if (S.gold < 20) return; S.gold -= 20; ensureShop(true); render(); }
  else if (a === 'reset') { $('resetBox').innerHTML = '<div class="row"><span class="grow sub">진행 상황이 모두 지워져요.</span><button class="btn sm" data-act="resetno">취소</button><button class="btn sm pri" data-act="resetyes">초기화</button></div>'; }
  else if (a === 'resetno') render();
  else if (a === 'resetyes') { S = freshState(); save(); render(); toast('처음부터 시작해요'); }
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') closeModal(); });

function start(data) {
  S = (data && data.S) || load() || freshState();
  if (!S.tab || S.tab === 'bag') S.tab = 'today';
  syncQuests(); save();
  render();
  if (typeof nativeStart === 'function') nativeStart();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
